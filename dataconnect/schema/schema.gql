# JOURNAL∞ Relational Schema for Firebase SQL Connect / Data Connect

type User @table {
  id: String! @default(expr: "auth.uid")
  email: String!
  displayName: String!
  createdAt: Date! @default(expr: "request.time")
}

type JournalEntry @table {
  id: UUID! @default(expr: "uuidV4()")
  userId: String!
  title: String!
  body: String!
  mode: String!
  mood: Int
  energy: Int
  tags: [String!]
  favorite: Boolean! @default(value: false)
  archived: Boolean! @default(value: false)
  createdAt: Date! @default(expr: "request.time")
  updatedAt: Date! @default(expr: "request.time")
}

type Memory @table {
  id: UUID! @default(expr: "uuidV4()")
  userId: String!
  type: String!
  title: String!
  narrative: String!
  importance: Int! @default(value: 3)
  confidence: Float! @default(value: 0.9)
  saved: Boolean! @default(value: false)
  status: String! @default(value: "candidate")
  occurredAt: Date! @default(expr: "request.time")
  createdAt: Date! @default(expr: "request.time")
}

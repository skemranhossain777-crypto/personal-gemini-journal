name: JOURNAL∞ Production CI/CD Pipeline

on:
  push:
    branches:
      - master
      - 'release/*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  # ============================================================================
  # STAGE 1: VALIDATION & TESTING (Steps 1-8)
  # ============================================================================
  validate-and-test:
    name: 🧪 1-8. Validate, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 1. Install Dependencies
        run: npm ci

      - name: 2. Dependency Audit & Security Validation
        run: npm audit --audit-level=high

      - name: 3. Typecheck Codebase
        run: npm run typecheck

      - name: 4. Execute Unit Tests
        run: npm test

      - name: 4a. Validate Firebase Config & Firestore Targets
        run: node scripts/validate-firebase-config.mjs

      - name: Setup Java 21 for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 4b. Run Firestore Security Rules Suite (Emulator)
        run: npm run test:rules

      - name: 5. Execute Complete Production Build
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          retention-days: 7

  # ============================================================================
  # STAGE 2: CONTAINER BUILD & VULNERABILITY SCAN (Steps 9-10)
  # ============================================================================
  build-and-scan-container:
    name: 🐳 9-10. Build Container & Scan Vulnerabilities
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 9. Build Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: journal-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 10. Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: journal-app:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # STAGE 3: STAGING DEPLOYMENT & SMOKE TESTS (Steps 11-12)
  # ============================================================================
  deploy-staging:
    name: 🚀 11-12. Deploy Staging & Smoke Test
    needs: build-and-scan-container
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Staging)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_STAGING }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP GCR
        run: gcloud auth configure-docker --quiet

      - name: Build & Push Container to Staging Registry
        run: |
          docker build --build-arg VITE_ENABLE_SEMANTIC_RETRIEVAL=false -t gcr.io/gen-lang-client-0345619653/journal-app:${{ github.sha }} .
          docker push gcr.io/gen-lang-client-0345619653/journal-app:${{ github.sha }}

      - name: 11. Deploy Container to Cloud Run (Staging)
        run: |
          gcloud run deploy gemini-journal-staging \
            --image="gcr.io/gen-lang-client-0345619653/journal-app:${{ github.sha }}" \
            --project="gen-lang-client-0345619653" \
            --region="us-central1" \
            --platform="managed" \
            --port="8080" \
            --service-account="journal-staging-sa@gen-lang-client-0345619653.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --labels="dev-tutorial=cloud-run-ai-challenge" \
            --set-env-vars="FIRESTORE_DATABASE_ID=gemini-journal,VITE_FIREBASE_PROJECT_ID=gen-lang-client-0345619653,NODE_ENV=production,APP_URL=${{ secrets.STAGING_APP_URL }}" \
            --set-secrets="GEMINI_API_KEY=journal-gemini-api-key:latest,GOOGLE_MAPS_API_KEY=journal-maps-api-key:latest,ADMIN_EMAILS=journal-admin-emails:latest,FIREBASE_SERVICE_ACCOUNT_JSON=journal-firebase-sa-json:latest"

      - name: 11b. Verify Staging Revision Ready & 100% Traffic
        run: |
          gcloud run services describe gemini-journal-staging \
            --project=gen-lang-client-0345619653 --region=us-central1 \
            --format='value(status.latestReadyRevisionName)' | grep -q 'gemini-journal-staging-'
          gcloud run services describe gemini-journal-staging \
            --project=gen-lang-client-0345619653 --region=us-central1 \
            --format='json' | python3 -c "import json,sys; t=json.load(sys.stdin)['status']['traffic']; assert any(x.get('percent')==100 and x.get('latestRevision') for x in t), 'traffic is not 100% latest'; print('revision ready + 100% traffic OK')"

      - name: 12. Execute Automated Staging Smoke Tests
        env:
          SMOKE_TARGET_URL: ${{ secrets.STAGING_APP_URL }}
        run: |
          node scripts/smoke-test.mjs

  # ============================================================================
  # STAGE 4: PRODUCTION DEPLOYMENT WITH MANUAL APPROVAL (Step 13)
  # ============================================================================
  deploy-production:
    name: 🛡️ 13. Production Deployment (Approval Required)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production # Requires manual environment approval in GitHub UI
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Production)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP GCR
        run: gcloud auth configure-docker --quiet

      - name: Tag & Push Container to Production Registry
        run: |
          docker build --build-arg VITE_ENABLE_SEMANTIC_RETRIEVAL=true -t gcr.io/gen-lang-client-0345619653/journal-app:${{ github.sha }} -t gcr.io/gen-lang-client-0345619653/journal-app:latest .
          docker push gcr.io/gen-lang-client-0345619653/journal-app:${{ github.sha }}
          docker push gcr.io/gen-lang-client-0345619653/journal-app:latest

      - name: 13. Deploy Container to Cloud Run (Production)
        run: |
          gcloud run deploy gemini-journal \
            --image="gcr.io/gen-lang-client-0345619653/journal-app:${{ github.sha }}" \
            --project="gen-lang-client-0345619653" \
            --region="us-central1" \
            --platform="managed" \
            --port="3000" \
            --allow-unauthenticated \
            --labels="dev-tutorial=cloud-run-ai-challenge" \
            --set-env-vars="FIRESTORE_DATABASE_ID=gemini-journal,VITE_FIREBASE_PROJECT_ID=gen-lang-client-0345619653,NODE_ENV=production,APP_URL=${{ secrets.PROD_APP_URL }},ENABLE_SEMANTIC_RETRIEVAL=true" \
            --set-secrets="GEMINI_API_KEY=journal-gemini-api-key:latest,GOOGLE_MAPS_API_KEY=journal-maps-api-key:latest,ADMIN_EMAILS=journal-admin-emails:latest,FIREBASE_SERVICE_ACCOUNT_JSON=journal-firebase-sa-json:latest"

      - name: 13b. Verify Production Revision Ready & 100% Traffic
        run: |
          gcloud run services describe gemini-journal \
            --project=gen-lang-client-0345619653 --region=us-central1 \
            --format='value(status.latestReadyRevisionName)' | grep -q 'gemini-journal-'
          gcloud run services describe gemini-journal \
            --project=gen-lang-client-0345619653 --region=us-central1 \
            --format='json' | python3 -c "import json,sys; t=json.load(sys.stdin)['status']['traffic']; assert any(x.get('percent')==100 and x.get('latestRevision') for x in t), 'traffic is not 100% latest'; print('revision ready + 100% traffic OK')"

      - name: Setup Node.js for Firestore Rules Deployment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies (Firebase CLI)
        run: npm ci

      - name: 13c. Deploy Firestore Rules & Indexes to Production
        # Deploys only the Firestore targets of `gen-lang-client-0345619653`
        # for the named database `gemini-journal` (resolved from firebase.json).
        # The google-github-actions/auth step above exports GOOGLE_APPLICATION_CREDENTIALS,
        # which firebase-tools reads for its deploy credentials. No Storage or
        # Data Connect targets are deployed.
        run: |
          npx firebase deploy --only firestore:rules,firestore:indexes \
            --project gen-lang-client-0345619653 --non-interactive

      - name: 13d. Verify Deployed Firestore Rules Match Repo Source
        run: |
          TOKEN="$(gcloud auth print-access-token)"
          node scripts/verify-firestore-rules.mjs "$TOKEN"

      - name: Production Smoke Tests
        env:
          SMOKE_TARGET_URL: ${{ secrets.PROD_APP_URL }}
        run: |
          node scripts/smoke-test.mjs
